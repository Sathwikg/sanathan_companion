<!DOCTYPE html>
<html lang="en">
<head>
    <!-- A template: the build stamps the {{Brand:...}} tokens from FrontEnd/Branding/Branding.props
         and serves the result as index.html (see FrontEnd/Directory.Build.targets). -->
    <meta charset="utf-8" />
    <!-- viewport-fit=cover hands the notch and home-indicator regions to CSS, which is what every
         env(safe-area-inset-*) rule in mobile.css depends on. It only works because MainPage sets
         ios:Page.UseSafeArea="False" — otherwise MAUI insets the WebView natively and the CSS
         insets all resolve to 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>{{Brand:AppName}}</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/App.UI.Shared/theme.css" />
    <link rel="stylesheet" href="_content/App.UI.Shared/app.css" />
    <!-- Mobile skin last: it deepens the shared styles rather than replacing them. -->
    <link rel="stylesheet" href="_content/App.UI.Shared/mobile.css" />
    <link rel="icon" href="data:,">

    <!-- Blocking on purpose: settles the theme attribute before first paint, so a dark-theme
         seeker does not get a full-screen cream flash on every cold start. -->
    <script src="_content/App.UI.Shared/theme.js"></script>
    <script>scTheme.boot();</script>
    <!-- Same reason, for the phone's text-size setting: the size the app last saw is applied
         before first paint, so a seeker with large text does not watch the screen grow. -->
    <script src="_content/App.UI.Shared/deviceDisplay.js"></script>
    <script>scDevice.boot();</script>

    <style>
        /* WebView-level concerns, kept out of mobile.css because that file is shared with the
           web host and may only touch .scm-* classes. */

        /* The shell owns the scroll, so the document must not bounce a second time — on iOS a
           double scroller shows the page's own background behind the rubber band, which reads
           as a rendering fault. */
        html, body {
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* The phone's own text size (Android Font size, iOS Dynamic Type), set by the host as
           --sc-font-scale. On the root, so every rem grows with it: text and the space around it
           together. 100% is the WebView's default, which the host pins at 16px: Android's own
           text-only zoom is switched off (MainPage) so the size is applied once, here.
           text-size-adjust stops iOS inflating text again when the phone turns sideways. */
        html {
            font-size: calc(100% * var(--sc-font-scale, 1));
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        /* Blazor's error strip carries no styling of its own here (App.Web inlines its own).
           Without this it renders as permanent body text at the top of every screen. */
        #blazor-error-ui {
            display: none;
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 100;
            padding: 0.7rem 1rem;
            padding-bottom: max(0.7rem, env(safe-area-inset-bottom, 0px));
            background: var(--color-error);
            color: var(--color-on-error);
            font-size: 0.9rem;
            box-shadow: var(--shadow-lg);
        }
        #blazor-error-ui .dismiss { float: right; cursor: pointer; }
        #blazor-error-ui .reload { color: inherit; text-decoration: underline; }
    </style>
</head>

<body>
    <div id="app">
        <div class="om-loader is-full">
            <div class="om-loader-ring" style="width:76px;height:76px;">
                <span class="om-loader-glyph" style="font-size:38px;">{{Brand:LogoMark}}</span>
            </div>
            <div class="om-loader-msg">Loading {{Brand:AppName}}…</div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/App.UI.Shared/imgCompress.js"></script>
    <script src="_content/App.UI.Shared/richText.js"></script>
    <script src="_content/App.UI.Shared/geo.js"></script>
    <script src="_content/App.UI.Shared/scrollLock.js"></script>
    <script src="_content/App.UI.Shared/viewport.js"></script>
    <script src="_content/App.UI.Shared/download.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
