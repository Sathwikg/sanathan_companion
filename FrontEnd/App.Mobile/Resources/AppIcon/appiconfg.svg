<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Icon foreground: an eight-petalled lotus (ashtadala padma).

     Deliberately pure geometry — no <text>. The ॐ glyph would be the obvious mark, but MAUI
     rasterises these SVGs at build time through SkiaSharp, which resolves fonts from the build
     machine; a Devanagari face missing on a CI agent would bake tofu boxes into every icon on
     every store listing. Paths render identically everywhere.

     All artwork stays inside a 280px circle so Android's adaptive-icon mask and iOS's rounded
     rect can crop the outer 33% without touching a petal. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g fill="#FFFFFF">
        <g opacity="0.62">
            <ellipse cx="228" cy="158" rx="27" ry="70" transform="rotate(22.5 228 228)" />
            <ellipse cx="228" cy="158" rx="27" ry="70" transform="rotate(67.5 228 228)" />
            <ellipse cx="228" cy="158" rx="27" ry="70" transform="rotate(112.5 228 228)" />
            <ellipse cx="228" cy="158" rx="27" ry="70" transform="rotate(157.5 228 228)" />
            <ellipse cx="228" cy="158" rx="27" ry="70" transform="rotate(202.5 228 228)" />
            <ellipse cx="228" cy="158" rx="27" ry="70" transform="rotate(247.5 228 228)" />
            <ellipse cx="228" cy="158" rx="27" ry="70" transform="rotate(292.5 228 228)" />
            <ellipse cx="228" cy="158" rx="27" ry="70" transform="rotate(337.5 228 228)" />
        </g>
        <ellipse cx="228" cy="152" rx="31" ry="76" />
        <ellipse cx="228" cy="152" rx="31" ry="76" transform="rotate(45 228 228)" />
        <ellipse cx="228" cy="152" rx="31" ry="76" transform="rotate(90 228 228)" />
        <ellipse cx="228" cy="152" rx="31" ry="76" transform="rotate(135 228 228)" />
        <ellipse cx="228" cy="152" rx="31" ry="76" transform="rotate(180 228 228)" />
        <ellipse cx="228" cy="152" rx="31" ry="76" transform="rotate(225 228 228)" />
        <ellipse cx="228" cy="152" rx="31" ry="76" transform="rotate(270 228 228)" />
        <ellipse cx="228" cy="152" rx="31" ry="76" transform="rotate(315 228 228)" />
    </g>

    <!-- The pericarp, punched back to the saffron beneath so the petals read as separate. -->
    <circle cx="228" cy="228" r="44" fill="#8D4E19" />
    <circle cx="228" cy="228" r="26" fill="#E4A951" />
</svg>
