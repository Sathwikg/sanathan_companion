<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Icon background. MAUI composites appiconfg.svg on top of this and, on platforms that mask
     the icon (Android adaptive, iOS rounded rect), crops it — so the artwork here is a flat
     saffron field with the colour work done by the gradient rather than by shapes near the edge. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="saffron" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C0631A" />
            <stop offset="1" stop-color="#8D4E19" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="456" height="456" fill="url(#saffron)" />
</svg>
