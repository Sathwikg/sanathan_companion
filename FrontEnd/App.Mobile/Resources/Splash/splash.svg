    <defs>
        <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#E4A951" />
            <stop offset="1" stop-color="#8D4E19" />
        </linearGradient>
    </defs>

    <g fill="url(#petal)">
        <g opacity="0.5">
            <ellipse cx="228" cy="158" rx="27" ry="70" transform="rotate(22.5 228 228)" />
