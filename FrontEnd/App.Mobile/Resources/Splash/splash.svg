<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Launch screen mark: the same lotus as the app icon, in saffron on the cream background
     declared by MauiSplashScreen Color="#FDFBF7", so launching lands on the app's own palette
     rather than a colour it never uses again. Geometry only, for the reason given in appiconfg.svg. -->
