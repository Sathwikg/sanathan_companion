<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Sanathan Companion</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/App.UI.Shared/theme.css" />
    <link rel="stylesheet" href="_content/App.UI.Shared/app.css" />
    <!-- Every rule in here is scoped to .scm-*, which only MobileLayout renders, so on the web
         it is inert. It is linked anyway so that setting Platform to Mobile in appsettings.json
         previews the real phone UI in a browser's device emulation. -->
    <link rel="stylesheet" href="_content/App.UI.Shared/mobile.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="App.Web.styles.css" rel="stylesheet" />
    <!-- Applies the saved theme before render to avoid a flash of the wrong theme. Shared with
         the MAUI host, which needs the same behaviour for a different reason (see theme.js). -->
    <script src="_content/App.UI.Shared/theme.js"></script>
    <script>scTheme.boot();</script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="om-loader is-full">
            <div class="om-loader-ring" style="width:76px;height:76px;">
                <span class="om-loader-glyph" style="font-size:38px;">ॐ</span>
            </div>
            <div class="om-loader-msg">Loading Sanathan Companion…</div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;left:0;right:0;padding:0.6rem 1rem;background:#8D4E19;color:#fff;">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/App.UI.Shared/imgCompress.js"></script>
    <script src="_content/App.UI.Shared/richText.js"></script>
    <script src="_content/App.UI.Shared/geo.js"></script>
    <script src="_content/App.UI.Shared/scrollLock.js"></script>
    <script src="_content/App.UI.Shared/download.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
