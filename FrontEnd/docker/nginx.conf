# Sanathana Companion — the single public entry point.
#
#   /      -> the Blazor WebAssembly app (static files baked into this image)
#   /api/  -> reverse-proxied to the API container
#
# Because both live on one origin the browser never issues a cross-origin
# request, so the API's Cors:AllowedOrigins list can stay empty.
#
# Response headers are set per-location rather than once at server level: nginx
# drops inherited add_header directives as soon as a location declares its own,
# and the API already sets its own security headers on /api responses.

server {
    listen      80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, re-resolved periodically so a restarted API
    # container (new IP) is picked up instead of cached forever at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Kestrel accepts 16 MB (audio uploads base64-inflate); don't reject earlier.
    client_max_body_size 20m;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    application/wasm image/svg+xml application/octet-stream;
    # Blazor publishes a .gz sibling for every framework asset — serve those
    # rather than re-compressing multi-megabyte wasm on each request.
    gzip_static     on;

    # ---- API ---------------------------------------------------------------
    location /api/ {
        set $sc_api http://api:8080;
        # $request_uri carries the path and query string through verbatim. It is
        # required here: a proxy_pass whose target contains a variable would
        # otherwise replace the request URI with the literal one written below.
        proxy_pass $sc_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout  10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        # Chant audio streams straight to the client instead of buffering first.
        proxy_buffering off;
    }

    # Only answers when the API runs with ASPNETCORE_ENVIRONMENT=Development;
    # in Production the API doesn't map Swagger and this returns 404.
    location /swagger {
        set $sc_api_swagger http://api:8080;
        proxy_pass $sc_api_swagger$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Blazor WebAssembly ------------------------------------------------
    # The SDK fingerprints every filename under _framework, so these can be
    # cached forever. A miss is a genuine 404, not a client-side route.
    location /_framework/ {
        try_files $uri =404;

        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff     always;
        add_header Referrer-Policy        no-referrer always;
        add_header X-Frame-Options        DENY        always;
    }

    # Everything else falls back to the SPA shell so deep links keep working.
    # no-cache (revalidate, not "never store") keeps index.html and the
    # entrypoint-generated appsettings.json from going stale after a redeploy.
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control          "no-cache" always;
        add_header X-Content-Type-Options nosniff     always;
        add_header Referrer-Policy        no-referrer always;
        add_header X-Frame-Options        DENY        always;
    }
}
