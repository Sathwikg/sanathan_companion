# Nitya Sannidhi - the stack deploy.ps1 runs on the VPS.
#
#   browser --> https://enityasannidhi.com --> caddy --> web (nginx) -+- /      static Blazor WebAssembly
#                                                                     +- /api/  --> api (.NET 10) --> Postgres on the VPS
#               https://gippslandfresh.au  --> caddy --> the grocery stack's containers
#
# `caddy` is the only Caddy on the host: it owns ports 80/443 and serves the grocery domain as
# well, over that project's network (see deploy/vps/Caddyfile). `web` also publishes ${WEB_PORT}
# for a direct, plain-http check that bypasses Caddy. The API is reachable only on the internal
# network, through the /api proxy. The app images are built locally and loaded by deploy.ps1,
# never pulled; caddy:2 is pulled from Docker Hub on the first deploy.
#
# No secrets here: every value comes from the .env next to this file on the server, which
# deploy.ps1 writes from the git-ignored .env.vps (plus IMAGE_TAG and WEB_PORT).

name: sanathana-companion

services:
  api:
    image: sanathana-api:${IMAGE_TAG:?IMAGE_TAG is written by deploy.ps1}
    container_name: sanathana-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # nginx is the only caller, so honour its X-Forwarded-* headers (safe: the API is not
      # published to the host).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:?set CONNECTION_STRING in .env.vps}
      JwtSettings__Secret: ${JWT_SECRET:?set JWT_SECRET in .env.vps}
      Admin__InitialPassword: ${ADMIN_INITIAL_PASSWORD:-}
      Google__ClientIds__0: ${GOOGLE_CLIENT_ID:-}
    expose:
      - "8080"
    # Lets the container reach Postgres running on the VPS as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # /api/regions/options is [AllowAnonymous] and queries the database, so a 200 proves the
      # Postgres connection works, not just that the process is up.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/api/regions/options"]
      interval: 15s
      timeout: 10s
      retries: 5
      # Migrations run at startup - allow for that.
      start_period: 90s
    networks: [appnet]

  web:
    image: sanathana-web:${IMAGE_TAG:?IMAGE_TAG is written by deploy.ps1}
    container_name: sanathana-web
    restart: unless-stopped
    environment:
      # Relative path => the SPA calls the API on its own origin, through the /api proxy.
      API_BASE_URL: /api
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      # Optional: Caddy reaches web on the internal network, so this exists only for a direct
      # http://<vps>:8081 check. nginx trusts X-Forwarded-* from Docker addresses alone, so a
      # request arriving here from the internet cannot impersonate Caddy.
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [appnet]

  caddy:
    image: caddy:2
    container_name: sanathana-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates and ACME account - keep across deploys
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    networks: [appnet, grocery]

networks:
  appnet:
    driver: bridge
  # The grocery stack's network, so Caddy can reach grocery-frontend and grocery-backend by
  # name. It exists as long as the grocery stack is up; `docker compose down` on the grocery
  # side fails to remove it while Caddy is attached, which is intended.
  grocery:
    name: grocery_deploy_default
    external: true

volumes:
  caddy_data:
  caddy_config:
